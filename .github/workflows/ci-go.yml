name: CI (Go)
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: namespace-profile-linux-amd64-2x4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
  vuln:
    name: Vulnerability check
    runs-on: namespace-profile-linux-amd64-4x8
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go
      - name: Vulnerability check
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
  test:
    name: Test
    runs-on: namespace-profile-linux-amd64-4x8
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go
      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Run tests with coverage
        run: task test:coverage:ci
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage
          path: coverage.out
  build:
    name: Build
    runs-on: namespace-profile-linux-amd64-2x4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go
      - name: Build all packages
        run: go build ./...
  buf-check:
    name: Buf lint & format
    runs-on: namespace-profile-linux-amd64-2x4
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint protobuf
        run: buf lint
      - name: Check protobuf formatting
        run: buf format --diff --exit-code
  manifests:
    name: Manifests up to date
    runs-on: namespace-profile-linux-amd64-2x4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go
      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Verify CRDs and deepcopy match Go types
        run: task manifests:verify
  docs:
    name: Docs build (strict)
    runs-on: namespace-profile-linux-amd64-2x4
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go
      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
      - name: Install protoc-gen-doc
        run: go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build router-hosts binary (for CLI docs)
        run: go build -o /tmp/router-hosts ./cmd/router-hosts
      - name: Build docs (strict)
        run: task docs:ci BINARY=/tmp/router-hosts
  e2e-fast:
    name: E2E (fast)
    runs-on: namespace-profile-linux-amd64-4x8
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go
      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Run fast e2e tier
        run: task test:e2e
  e2e-docker:
    name: E2E (docker)
    runs-on: namespace-profile-linux-amd64-4x8
    timeout-minutes: 10
    env:
      RH_E2E_REQUIRE_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go
      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Run docker e2e tier (Docker made unreachable, DO NOT MERGE)
        # Red proof for CI-03/D-10: proves e2e-docker FAILS rather than
        # SKIPS when Docker is unavailable, with RH_E2E_REQUIRE_DOCKER
        # still set. This runner exposes "docker" from more than one PATH
        # entry (at least /vendor/docker, read-only, and /usr/bin, which
        # appears writable). For every PATH directory containing a
        # "docker" file: rename it if that succeeds, otherwise drop the
        # whole directory from PATH for this one command. Either way,
        # exec.LookPath("docker") ends up with a real not-found error
        # instead of finding it via whichever entry survives (a found
        # binary would make dockergate.Decide see probeErr == nil and
        # Proceed instead of Fatal). This step and this branch are
        # throwaway.
        run: |
          echo "docker before: $(command -v docker || echo 'not found')"
          IFS=':' read -ra dirs <<< "$PATH"
          keep=()
          for d in "${dirs[@]}"; do
            if [ -e "$d/docker" ]; then
              if mv "$d/docker" "$d/docker.disabled-redproof" 2>/dev/null; then
                echo "renamed docker in $d"
                keep+=("$d")
              else
                echo "cannot rename docker in $d, dropping dir from PATH for this command"
              fi
            else
              keep+=("$d")
            fi
          done
          no_docker_path="$(IFS=:; echo "${keep[*]}")"
          echo "docker after: $(PATH="$no_docker_path" command -v docker || echo 'not found')"
          PATH="$no_docker_path" go test -tags docker_e2e -count=1 -v -timeout 5m ./e2e/
  e2e-proc:
    name: E2E (proc)
    runs-on: namespace-profile-linux-amd64-4x8
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules and build
        uses: namespacelabs/nscloud-cache-action@c5f8dab7560444c4bf8dbc64f1b203431873c547 # v1
        with:
          cache: go
      - name: Install task runner
        run: go install github.com/go-task/task/v3/cmd/task@latest
      - name: Remove any pre-existing bin/ (structural fresh build)
        # nscloud-cache-action's cache: go mode persists only
        # GOCACHE/GOMODCACHE and never touches bin/, so this step converts
        # "no cache step happens to restore bin/ today" into "bin/ cannot be
        # restored" (D-08). Must run before task test:e2e:proc, whose
        # deps: ['build'] rebuilds into whatever bin/ already contains.
        run: rm -rf bin/
      - name: Run proc e2e tier
        run: task test:e2e:proc
  ci-go-complete:
    name: CI (Go) Complete
    if: always()
    needs: [lint, vuln, test, build, buf-check, manifests, docs, e2e-fast, e2e-docker, e2e-proc]
    runs-on: namespace-profile-linux-amd64-2x4
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          VULN_RESULT: ${{ needs.vuln.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUF_RESULT: ${{ needs.buf-check.result }}
          MANIFESTS_RESULT: ${{ needs.manifests.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          E2E_FAST_RESULT: ${{ needs.e2e-fast.result }}
          E2E_DOCKER_RESULT: ${{ needs.e2e-docker.result }}
          E2E_PROC_RESULT: ${{ needs.e2e-proc.result }}
        run: |-
          if [[ "$LINT_RESULT" != "success" ]] ||
             [[ "$VULN_RESULT" != "success" ]] ||
             [[ "$TEST_RESULT" != "success" ]] ||
             [[ "$BUILD_RESULT" != "success" ]] ||
             [[ "$BUF_RESULT" != "success" ]] ||
             [[ "$MANIFESTS_RESULT" != "success" ]] ||
             [[ "$DOCS_RESULT" != "success" ]] ||
             [[ "$E2E_FAST_RESULT" != "success" ]] ||
             [[ "$E2E_DOCKER_RESULT" != "success" ]] ||
             [[ "$E2E_PROC_RESULT" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed"
