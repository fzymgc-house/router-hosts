{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "router-hosts-operator.fullname" . }}
  labels:
    {{- include "router-hosts-operator.labels" . | nindent 4 }}
rules:
  # Traefik IngressRoute resources (traefik.io/v1alpha1).
  # The IngressRoute controller watches these and writes finalizers plus the
  # host-id annotation back, so it needs update/patch in addition to read.
  - apiGroups: ["traefik.io"]
    resources: ["ingressroutes", "ingressroutetcps"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Gateway API routes (gateway.networking.k8s.io). The controller writes a
  # finalizer + host-ids annotation, so update;patch are required.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes", "grpcroutes", "tlsroutes"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Gateway resources are read-only (IP resolution from status.addresses).
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways"]
    verbs: ["get", "list", "watch"]

  # HostMapping resources (router-hosts.fzymgc.house/v1alpha1).
  # The controller adds/removes a cleanup finalizer (update/patch) and writes
  # reconcile state to the status subresource. Verbs mirror the controller's
  # kubebuilder marker (internal/operator/hostmapping_controller.go).
  - apiGroups: ["router-hosts.fzymgc.house"]
    resources: ["hostmappings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["router-hosts.fzymgc.house"]
    resources: ["hostmappings/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["router-hosts.fzymgc.house"]
    resources: ["hostmappings/finalizers"]
    verbs: ["update"]

  # v1/Service resources. The controller writes a finalizer + host-ids
  # annotation, so update;patch are required (D-24). No delete verb, and no
  # status subresource grant: this controller never writes Service status —
  # the Kubernetes Events below are the signalling channel instead.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "update", "patch"]

  # Kubernetes Events (D-12/D-13). No apiGroups: [""] events rule existed
  # anywhere in this chart's ClusterRole before this phase — the only events
  # rule was namespace-scoped in role-leader-election.yaml, which meant
  # HostMappingReconciler's Recorder was failing silently for any HostMapping
  # outside the operator's own namespace. This cluster-scoped rule fixes that
  # as a side effect while enabling the Service controller's failure events.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- end }}
